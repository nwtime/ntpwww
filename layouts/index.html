{{ define "main" }}
<body style="--bs-body-text-align: center;">
  <section class="min-vh-100 mt-auto">
<div class="card">
  <div class="card-body">
    <h3 class="card-title" style="color: #1a79c0;  margin-top: 1rem; text-align: center;"><a href="/donate/">Your Donations Help Support NTP -- Donate Today!</a></h3>
	<img src="https://www.nwtime.org/images/support.jpg" class="figure-img img-fluid">
  </div>
</div>
<div class="container" style="--bs-body-text-align: start;">
  	<h3>{{ .Title }}</h3></br>
    {{ with .Params.description }}<div class="lead">{{ . | markdownify }}</div>{{ end }} 

  <div class="row">
	  <p>{{.Content}}</p>
  </div>
</div>

	<hr class="mt-5">
<br />
<button class="btn btn-primary btn-lg">
  <a class="btn btn-primary btn-lg" href="https://downloads.nwtime.org/ntp/">Download NTP <img src="/images/icons/download.svg"></img></a>
    </button>	
<button class="btn btn-primary btn-lg">
  <a class="btn btn-primary btn-lg" href="/bugs/">Report a Bug <img src="/images/icons/bug.svg"></img></a>
</button>
<br /><br />
  </section>
</body>
{{ end }}
