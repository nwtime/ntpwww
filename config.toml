baseURL = "https://www.ntp.org/"
title = "NTP: Network Time Protocol"
canonifyurls = true
enableRobotsTXT = true
disablePathToLower = true

# JS Plugins
  [[params.plugins.js]]
  link = "plugins/bootstrap-5.1.3/js/bootstrap.bundle.min.js"

# Preloader
  [params.preloader]
  preloader = "" # use .png , .svg or .gif format


# Disable creation of categories and tags pages
disableKinds = ["taxonomy", "taxonomyTerm"]

# Get lastmod for sitemap from git
enableGitInfo = true

# Comply with GDPR
[privacy.googleAnalytics]
  anonymizeIP = true
  respectDoNotTrack = true

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = false
  [minify.tdewolff]
    [minify.tdewolff.css]
      keepCSS2 = true
      precision = 0
    [minify.tdewolff.html]
      keepComments = false
      keepConditionalComments = true
      keepDefaultAttrVals = true
      keepDocumentTags = true
      keepEndTags = true
      keepQuotes = false
      keepWhitespace = true
    [minify.tdewolff.js]
      keepVarNames = false
      noNullishOperator = false
      precision = 0
    [minify.tdewolff.json]
      keepNumbers = false
      precision = 0
    [minify.tdewolff.svg]
      precision = 0
    [minify.tdewolff.xml]
      keepWhitespace = false

# Language settings
contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Highlighting config
pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsUseClassic = false
pygmentsStyle = "tango"

[blackfriday]
plainIDAnchors = true
hrefTargetBlank = true
angledQuotes = false
latexDashes = true

[imaging]
resampleFilter = "CatmullRom"
quality = 75
anchor = "smart"

[languages]
[languages.en]
contentDir = "content/en"
title = "NTP: Network Time Protocol"
languageName ="English"
# Weight used for sorting.
weight = 1

[languages.ja]
contentDir = "content/ja"
title = "NTP: ネットワークタイムプロトコル "
description = ""
languageName ="日本語"
# Weight used for sorting.
weight = 3

[markup]
  [markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
      # See a complete list of available styles at https://xyproto.github.io/splash/docs/all.html
      style = "tango"
      # Uncomment if you want your chosen highlight style used for code blocks without a specified language
      # guessSyntax = "true"

[params]
copyright = "Network Time Foundation"
logo1 = "images/ntp_logo.jpg"
logo2 = "images/logo.png"
description = "The NTP Project conducts Research and Development in NTP, a protocol designed to synchronize the clocks of computers over a network to a common timebase."
images = ["/images/NTPLogo800x418.webp"]
	 
github_repo = "https://github.com/ntp-project/ntp"

[params.ui]
breadcrumb_disable = false
#  Set to true to hide the sidebar search box (the top nav search box will still be displayed if search is enabled)
sidebar_search_disable = false

# Set to true to disable the About link in the site footer
footer_about_disable = true

[params.links]
[[params.links.user]]
	name ="Join the Community on Discourse"
	url = "https://community.nwtime.org"
	icon = "/images/icons/discourse.svg"
[[params.links.user]]
	name ="Subscribe to NTF's Newsletter"
	url = "https://www.nwtime.org/subscribe/"
	icon = "/images/icons/newspaper.svg"
[[params.links.user]]
	name ="Follow us on LinkedIn"
